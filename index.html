<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pra você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

<style>
  /* ================= CORES E FONTES (mude aqui) ================= */
  :root {
    --indigo: #484b7e;
    --indigo-fundo: #34365f;
    --creme: #f6f4df;
    --rosa: #ff8fb8;
    --fonte-cima: 'Bebas Neue', 'Oswald', Impact, sans-serif;
    --fonte-baixo: 'Cinzel', 'Times New Roman', Georgia, serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--indigo-fundo);
    color: var(--creme);
    font-family: var(--fonte-baixo);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex;
  }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(20px, 4vh, 36px);
    padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
  }

  /* ================= FOTO ================= */
  figure {
    background: var(--creme);
    padding: clamp(8px, 2vw, 14px) clamp(8px, 2vw, 14px) 0;
    width: min(220px, 52vw);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, .08), 0 24px 60px rgba(8, 9, 30, .55);
    transform: rotate(-2deg);
  }
  figure .moldura { overflow: hidden; background: #d9d6c0; aspect-ratio: 3 / 4; }
  figure img { display: block; width: 100%; height: 100%; object-fit: cover; }
  figure .foto-vazia {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 14px; font-size: .78rem; line-height: 1.5; color: var(--indigo);
  }
  figcaption {
    font-weight: 700; text-align: center; letter-spacing: .08em; text-transform: uppercase;
    color: var(--indigo); font-size: .8rem; min-height: 36px; display: flex; align-items: center; justify-content: center;
  }

  /* ================= TEXTO ================= */
  h1 {
    font-family: var(--fonte-cima); font-weight: 400; text-transform: uppercase;
    font-size: clamp(1.9rem, 7vw, 2.8rem); line-height: 1; text-align: center;
  }
  #subtitulo {
    font-size: .85rem; letter-spacing: .05em; text-align: center; color: #d8d6f3; max-width: 32ch;
  }

  /* ================= PONTOS DA SENHA ================= */
  #pontos { display: flex; gap: 14px; }
  #pontos span {
    width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--creme); background: transparent;
    transition: background .15s, transform .15s;
  }
  #pontos span.cheio { background: var(--creme); transform: scale(1.1); }

  #cartao.erro { animation: tremer .4s; }
  @keyframes tremer {
    20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); }
  }
  #msg-erro {
    min-height: 1.2em; font-size: .8rem; color: var(--rosa); font-weight: 700;
    letter-spacing: .04em; visibility: hidden;
  }
  #msg-erro.mostra { visibility: visible; }

  /* ================= TECLADO ================= */
  #teclado {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    width: min(260px, 70vw);
  }
  #teclado button {
    aspect-ratio: 1; border-radius: 50%; border: 1px solid rgba(246, 244, 223, .35);
    background: rgba(246, 244, 223, .06); color: var(--creme);
    font-family: var(--fonte-baixo); font-size: 1.3rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background .15s, transform .1s;
  }
  #teclado button:active { transform: scale(.92); background: rgba(246, 244, 223, .22); }
  #teclado button:focus-visible { outline: 2px solid var(--creme); outline-offset: 2px; }
  #teclado button.vazio { visibility: hidden; cursor: default; }
  #teclado button.apagar { font-size: 1rem; }
  #teclado button.apagar svg { width: 20px; height: 20px; fill: currentColor; }

  /* ================= DICA ================= */
  #dica {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: #b9b6e4;
    text-align: center;
  }
  #dica svg { width: 16px; height: 16px; fill: currentColor; }

  /* ================= LADO A LADO NO DESKTOP ================= */
  @media (min-width: 680px) {
    main {
      flex-direction: row; align-items: center; justify-content: center; gap: clamp(40px, 7vw, 90px);
      max-width: 1000px; margin: 0 auto;
    }
    #coluna { display: flex; flex-direction: column; align-items: center; gap: clamp(18px, 3vh, 30px); }
  }

  @media (prefers-reduced-motion: reduce) {
    #cartao.erro { animation: none; }
  }
</style>
</head>

<body>
<main>
  <figure>
    <div class="moldura"><img id="foto" alt="Foto" src=""></div>
    <figcaption id="legenda-foto"></figcaption>
  </figure>

  <div id="coluna" style="display:flex; flex-direction:column; align-items:center; gap:clamp(18px, 3vh, 30px);">
    <div id="cartao" style="display:flex; flex-direction:column; align-items:center; gap:inherit;">
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
      <div id="pontos" role="status" aria-label="Senha digitada"></div>
      <p id="msg-erro"></p>
    </div>

    <div id="teclado" role="group" aria-label="Teclado numérico"></div>

    <div id="dica">
      <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
      <span id="texto-dica"></span>
    </div>
  </div>
</main>

<script>
/* =====================================================================
   CONFIGURAÇÕES
   ===================================================================== */
const CONFIG = {
  // A senha é só números. Troque pelo dia do aniversário de namoro, por exemplo
  // "050824" para 05/08/2024 (dia, mês e os 2 últimos números do ano).
  senha: "050826",

  titulo: "Acesso bloqueado",
  subtitulo: "Digite a senha",
  dica: "Dica: Quando tudo começou",

  fotoCapa: "fotos/capa.jpg",       // a foto que aparece do lado do teclado
  legendaFoto: "",

  proximaPagina: "inicio.html"      // pra onde vai depois da senha certa
};

/* =====================================================================
   MONTAGEM
   ===================================================================== */
document.getElementById("titulo").textContent = CONFIG.titulo;
document.getElementById("subtitulo").textContent = CONFIG.subtitulo;
document.getElementById("texto-dica").textContent = CONFIG.dica;
document.getElementById("legenda-foto").textContent = CONFIG.legendaFoto;

const foto = document.getElementById("foto");
foto.onerror = () => {
  const v = document.createElement("div");
  v.className = "foto-vazia";
  v.textContent = "Coloque a foto em: " + CONFIG.fotoCapa;
  foto.replaceWith(v);
};
foto.src = CONFIG.fotoCapa;

const pontosEl = document.getElementById("pontos");
const TAMANHO = CONFIG.senha.length;
for (let i = 0; i < TAMANHO; i++) pontosEl.appendChild(document.createElement("span"));

const ICONE_APAGAR = '<svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-4.59 12.59L16 17l-3-3-3 3-1.41-1.41L11.59 12 8.59 9 10 7.59l3 3 3-3L17.41 9 14.41 12z"/></svg>';

const teclado = document.getElementById("teclado");
const TECLAS = ["1","2","3","4","5","6","7","8","9","","0","apagar"];
TECLAS.forEach((t) => {
  const b = document.createElement("button");
  b.type = "button";
  if (t === "") { b.className = "vazio"; b.tabIndex = -1; }
  else if (t === "apagar") { b.className = "apagar"; b.innerHTML = ICONE_APAGAR; b.setAttribute("aria-label", "Apagar"); b.addEventListener("click", apagar); }
  else { b.textContent = t; b.addEventListener("click", () => digitar(t)); }
  teclado.appendChild(b);
});

/* =====================================================================
   LÓGICA DA SENHA
   ===================================================================== */
let atual = "";
const cartao = document.getElementById("cartao");
const msgErro = document.getElementById("msg-erro");

function redesenhar() {
  [...pontosEl.children].forEach((span, i) => span.classList.toggle("cheio", i < atual.length));
}

function digitar(n) {
  if (atual.length >= TAMANHO) return;
  msgErro.classList.remove("mostra");
  atual += n;
  redesenhar();
  if (atual.length === TAMANHO) conferir();
}

function apagar() {
  msgErro.classList.remove("mostra");
  atual = atual.slice(0, -1);
  redesenhar();
}

function conferir() {
  if (atual === CONFIG.senha) {
    try { sessionStorage.setItem("entrou", "1"); } catch (e) {}
    cartao.style.transition = "opacity .5s";
    document.body.style.transition = "opacity .5s";
    document.body.style.opacity = "0";
    setTimeout(() => { location.href = CONFIG.proximaPagina; }, 480);
  } else {
    msgErro.textContent = "Senha errada bocó de mola, tenta dnv";
    msgErro.classList.add("mostra");
    cartao.classList.remove("erro");
    void cartao.offsetWidth;
    cartao.classList.add("erro");
    setTimeout(() => { atual = ""; redesenhar(); }, 350);
  }
}

// deixa digitar pelo teclado físico também
document.addEventListener("keydown", (e) => {
  if (e.key >= "0" && e.key <= "9") digitar(e.key);
  else if (e.key === "Backspace") apagar();
});

// já entrou nesta sessão: pula direto
try {
  if (sessionStorage.getItem("entrou") === "1") location.href = CONFIG.proximaPagina;
} catch (e) {}
</script>
</body>
</html>
